<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Plataforma de Autoevaluación Docente - Colegio San Buenaventura</title>
    <meta name="description" content="Sistema de autoevaluación y co-evaluación docente del Colegio San Buenaventura">
    
    <!-- CSS Estilos -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Librerías de gráficos y animación CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK (Compat 9.23.0) para Firestore en Tiempo Real -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Iframe invisible para motor de impresión aislado nativo (Cero congelamientos) -->
    <iframe id="print-iframe" style="position: absolute; width: 0; height: 0; border: none; visibility: hidden;"></iframe>

    <header class="app-header glass-container no-print">
        <div class="header-content">
            <div class="brand-logo" onclick="handleLogoClick()">
                <div class="brand-emblem-wrap">
                    <img src="logo.png" alt="Escudo San Buenaventura" class="brand-img" onerror="this.style.display='none'; document.getElementById('svg-emblem-fallback').style.display='flex';">
                    <div id="svg-emblem-fallback" style="display:none; width:44px; height:44px; border-radius:8px; background:var(--primary-color); align-items:center; justify-content:center; color:white; font-size:1.4rem;">
                        🏫
                    </div>
                </div>
                <div class="brand-titles">
                    <h1>Colegio San Buenaventura</h1>
                    <p>Autoevaluación y Co-Evaluación Docente • Curso 2026-2027</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="badge cloud-sync-status-badge" style="display:none;" id="cloud-sync-badge">☁️ Conectando...</span>
                <button class="theme-toggle-btn" id="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content" id="app">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>Cargando plataforma...</p>
        </div>
    </main>

    <div class="toast-notification" id="toast" role="alert" aria-live="polite">
        <span id="toast-text"></span>
    </div>

    <!-- Scripts de la Aplicación -->
    <script src="app.js"></script>
</body>
</html>
