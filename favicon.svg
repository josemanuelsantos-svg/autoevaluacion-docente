<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tauGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  
  <!-- Fondo Squircle Azul Marino -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  
  <!-- Cruz de Tau Franciscana Estilizada -->
  <path d="M 14 15 
           C 14 13.5, 15.5 13, 17 13 
           L 47 13 
           C 48.5 13, 50 13.5, 50 15 
           C 50 16.5, 48.5 17, 47 17 
           L 38 17 
           L 38 48 
           C 38 50.5, 36.5 52, 32 52 
           C 27.5 52, 26 50.5, 26 48 
           L 26 17 
           L 17 17 
           C 15.5 17, 14 16.5, 14 15 Z" 
        fill="url(#tauGrad)" 
        stroke="#ffffff" 
        stroke-width="1.2"
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>